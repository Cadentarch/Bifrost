name: Desktop Build

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            tasks: packageUberJarForCurrentOS packageDeb
            container: debian:trixie
          - os: windows-latest
            name: windows
            tasks: packageUberJarForCurrentOS packageExe
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    name: Build ${{ matrix.name }}

    steps:
      - name: Install container dependencies
        if: matrix.container
        run: apt-get update && apt-get install -y git fakeroot binutils file

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build
        shell: bash
        run: |
          ./gradlew :desktop:${{ matrix.tasks }}
          ./gradlew --stop

      - name: Upload UberJar
        uses: actions/upload-artifact@v5
        with:
          name: bifrost-${{ matrix.name }}-uberjar
          path: desktop/build/compose/jars/*.jar

      - name: Upload Installer (Linux deb)
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v5
        with:
          name: bifrost-linux-deb
          path: desktop/build/compose/binaries/main/deb/*.deb

      - name: Upload Installer (Windows exe)
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v5
        with:
          name: bifrost-windows-exe
          path: desktop/build/compose/binaries/main/exe/*.exe

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/build/compose/jars/*.jar
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/exe/*.exe
